# Lint, type-check and build the app, and run the tests (incl. database access rules on an in-memory
# Postgres), for every pull request and every push to develop and main.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build (type-checks src/, vite.config.ts and api/)
        run: yarn build

      - name: Test
        run: yarn test
